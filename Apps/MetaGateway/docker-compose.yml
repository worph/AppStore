  tips:
    before_install:
      en_us: |
        **Self-contained — no MetaCore required.** MetaGateway ships its own
        meta-core, ingester and feeders. Pair it with **MetaWatch** to browse
        what it surfaces.

        **Authentication:** The gateway dashboard is protected by Yundera's
        Authelia via OIDC.

        **The gateway works out of the box.** Books, papers and common-media
        feeders need no setup. Torrent/video needs the separate **Prowlarr** and
        **Tribler** apps — until they're installed + configured, those feeders
        simply show as **"degraded"** in the dashboard (they don't crash the app).

        **Torznab / Prowlarr setup (required for torrent video):**
        1. Install the **Prowlarr** app from the store (it runs on the shared
           network as `prowlarr`).
        2. Open Prowlarr, complete its first-run wizard, then Indexers → Add
           Indexer → add one or more public indexers (confirm they test green).
        3. Settings → General → copy the **API Key**.
        4. In the gateway dashboard, open the **torznab** plugin → configure, paste
           the key into the indexer's API-key field, and Save. The torznab feeder
           auto-reloads and turns healthy.

        **Tribler (optional, decentralized torrents):** install the **Tribler**
        app from the store; the gateway's tribler feeder connects to it
        automatically over the shared network — no key needed.

        **TMDB enrichment:** set the TMDB v4 token in the torznab / tribler plugin
        config (dashboard) for canonical posters + overviews.

        **Federation ports (optional).** The gateway-app host-publishes its
        libp2p listener on TCP **4002** (discovery / live fan-out) and the
        meta-share ingester on TCP **4005** (records + bitswap byte-serving) —
        open both inbound for best cross-node reach; same-host discovery (a
        MetaWatch on the same box) works over mDNS without them.

  pre-install-cmd: |
    # Feeders map: all feeders are now SEPARATE store apps, listed by their pcs
    # URLs (MetaFeeder · Gutenberg / arXiv / Europe PMC / Wikimedia Commons /
    # Prowlarr / Tribler — the opt-in Sci-Hub and Giphy apps are not seeded). The
    # gateway soft-skips any feeder that isn't installed/reachable, and you can
    # add/remove feeders at runtime from the dashboard. Each key/URL MUST match
    # the corresponding app's feeder container hostname.
    # Guarded: this hook reruns on every reinstall and every version upgrade, and
    # the feeder map is editable from the dashboard — an unguarded `cat >` would
    # silently discard the operator's feeders each time.
    if [ ! -f /DATA/AppData/metagateway/state/gateway-config.json ]; then
    cat > /DATA/AppData/metagateway/state/gateway-config.json <<'JSON'
    {
      "meta_core_url":  "http://metagateway-core:9000",
      "meta_share_url": "http://metagateway-share:3000",
      "feeders": {
        "gutenberg-feeder":   { "url": "http://metafeedergutenberg-feeder:8080" },
        "arxiv-feeder":       { "url": "http://metafeederarxiv-feeder:8080" },
        "europepmc-feeder":   { "url": "http://metafeedereuropepmc-feeder:8080" },
        "wikicommons-feeder": { "url": "http://metafeederwikicommons-feeder:8080" },
        "prowlarr-feeder":    { "url": "http://metafeederprowlarr-feeder:8080" },
        "tribler-feeder":     { "url": "http://metafeedertribler-feeder:8080" }
      }
    }
    JSON
    fi
    if [ ! -f /DATA/AppData/metagateway/state/gateway-enabled.json ]; then
    cat > /DATA/AppData/metagateway/state/gateway-enabled.json <<'JSON'
    {
      "disabled": [],
      "enabled_opt_in": ["torznab", "tribler"]
    }
    JSON
    fi

# Maison (Yundera dashboard) configuration. Read in preference to x-casaos.
# schema_version 2 is required for `folders`: an older Maison refuses the app
# outright rather than starting it without its directories.
x-compose-app:
  schema_version: 2
  # Created and chowned by Maison before any image is pulled, before any hook
  # runs and before the containers start — on the first boot and every one after.
  # Compose would otherwise create a missing bind source as a root-owned dir.
  folders:
    - path: /DATA/AppData/metagateway/metacore
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/metagateway/files
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/metagateway/state
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/metagateway/share-config
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/metagateway/share-data
      user: $PUID
      group: $PGID
  # Same string as the caddy_0 label, so the tile link and the route agree.
  webui-host: metagateway-${domain}
  webui-path: "/"
