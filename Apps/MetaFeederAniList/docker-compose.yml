name: metafeederanilist

# =============================================================================
# MetaFeeder · AniList — the comics/manga IDENTITY tier for MetaMesh.
#
# AniList names the *work*: title, cover, synopsis, author, reading direction,
# and the `anilistid` chapters anchor on. Keyless, cheap, no config. It serves no
# chapters and must not. Split out of the former MetaFeeder · Comic app; pairs
# with **MetaFeeder · Suwayomi** (the chapters).
#
# It needs, over the shared `pcs` network:
#   - the **MetaGateway** app — which must list this feeder's URL
#     (`http://metafeederanilist-feeder:8080`) in its feeders config so it gets discovered.
#     Discovery is startup-only, so restart the gateway afterwards.
#
# Everything is scoped under the `metafeederanilist-*` prefix + the per-stack `metafeederanilist` network +
# /DATA/AppData/metafeederanilist/ data root, so it installs beside the other Meta* apps with
# zero collisions.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # metafeederanilist-feeder — the identity tier. Answers "this series exists; here
  # are its ids, cover, synopsis, reading direction, author." Keyless.
  # ---------------------------------------------------------------------------
  metafeederanilist-feeder:
    image: ghcr.io/worph/meta-feeder-anilist:1.0.2
    cpu_shares: 30
    container_name: metafeederanilist-feeder
    mem_limit: 256m
    memswap_limit: 256m
    hostname: metafeederanilist-feeder
    restart: unless-stopped
    user: "0:0"
    expose:
      - 8080
    environment:
      RUST_LOG: "info,meta_feeder=info,anilist_feeder=info"
      META_FEEDER_STATE_DIR: "/data/meta-feeder"
      TZ: "$TZ"
    volumes:
      # Persist feeder config.json + redb cache so it survives recreate.
      - ${DATA_ROOT:-/DATA}/AppData/metafeederanilist/state:/data/meta-feeder:rw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - metafeederanilist
      - pcs

  # ---------------------------------------------------------------------------
  # AppShield gate — the feeder's config page behind Yundera OIDC SSO.
  # container_name == subdomain prefix (the auth-registrar derives the client_id
  # from it). The gateway still reaches the feeder directly on `pcs`; index → /config.
  # ---------------------------------------------------------------------------
  metafeederanilist:
    image: ghcr.io/yundera/appshield:2.0.9
    cpu_shares: 80
    container_name: metafeederanilist
    hostname: metafeederanilist
    restart: unless-stopped
    user: "0:0"
    expose:
      - 80
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "metafeederanilist-feeder"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
    labels:
      caddy_0: metafeederanilist-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: metafeederanilist-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: metafeederanilist-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - metafeederanilist-feeder
    networks:
      - metafeederanilist
      - pcs

networks:
  metafeederanilist:
    name: metafeederanilist
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Worph Team
  category: Media
  developer: Aptero Team
  main: metafeederanilist
  webui_port: 80
  index: /config

  description:
    en_us: |
      **The comics and manga identity tier for MetaMesh.**

      MetaFeeder · AniList names the *work* — title, cover, synopsis, author, reading
      direction, and the id chapters anchor on. Keyless and cheap.

      **Pairs with MetaFeeder · Suwayomi**, which supplies the chapters: chapters
      matched to an AniList work converge on **one** work page instead of
      fragmenting into one tile per romanisation. **Pairs with MetaRead**, the reading
      client.
      **Requires:** **MetaGateway** — its meta-core stores the resolved records and
      announces them to the swarm. The gateway must list this feeder in its config.
    fr_fr: |
      **La couche d'identité BD et manga de MetaMesh.**

      MetaFeeder · AniList nomme l'*œuvre* — titre, couverture, synopsis, auteur, sens
      de lecture, et l'identifiant sur lequel les chapitres s'ancrent. Sans clé.

      **Va avec MetaFeeder · Suwayomi** (les chapitres) et **MetaRead**. **Nécessite**
      l'app **MetaGateway**.
  tagline:
    en_us: AniList — the comics and manga identity tier for MetaMesh
    fr_fr: AniList — la couche d'identité BD et manga de MetaMesh

  title:
    en_us: MetaFeeder · AniList

  icon: https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/MetaFeederAniList/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/MetaFeederAniList/thumbnail.png

  store_app_id: metafeederanilist
  is_uncontrolled: false

  tips:
    before_install:
      en_us: |
        **Install order:** install **MetaGateway** first (its meta-core stores and
        announces what this feeder finds).

        **After installing this app:** in **MetaGateway**, add this feeder from the
        dashboard's *Add a feeder* box — name `anilist-feeder`, URL `http://metafeederanilist-feeder:8080`.
        The gateway restarts itself: feeder discovery is startup-only.
        No other setup. For chapters, also install **MetaFeeder · Suwayomi**.
        **Authentication:** the config UI is protected by Yundera's Authelia (OIDC).

# Maison (Yundera dashboard) configuration. Read in preference to x-casaos.
# schema_version 2 is required for `folders`: an older Maison refuses the app
# outright rather than starting it without its directories.
x-compose-app:
  schema_version: 2
  # Created and chowned by Maison before any image is pulled, before any hook
  # runs and before the containers start — on the first boot and every one after.
  # Compose would otherwise create a missing bind source as a root-owned dir.
  folders:
    - path: /DATA/AppData/metafeederanilist/state
      user: $PUID
      group: $PGID
  # Same string as the caddy_0 label, so the tile link and the route agree.
  webui-host: metafeederanilist-${domain}
  webui-path: "/config"
