name: metafeederindexer

# =============================================================================
# MetaFeeder - Indexer — a STANDALONE Prowlarr feeder for MetaMesh.
#
# Bridges your **Prowlarr** indexers — Torznab/Newznab, torrent AND usenet — into
# MetaMesh, so releases surface in **MetaWatch**. Prowlarr is the separate store
# app (container `prowlarr:9696`) that aggregates the indexers.
#
# (The Tribler source used to ride in this same app; it was extracted into its
# own image + app — install **MetaFeeder · Tribler** for decentralized IPv8
# discovery. This app is now Prowlarr/Torznab-only.)
#
# Split out of the MetaGateway stack so the sources stay modular. Self-contained
# for enrichment: ships its own filename-parser + tmdb plugins.
#
# It needs, all reached over the shared `pcs` network:
#   1. the **Prowlarr** store app (`prowlarr:9696`) — the indexer source.
#   2. the shared **MetaCore** app (`metacore-app:9000`) — where resolved
#      records + TMDB posters are stored; the shared **MetaShare** app then
#      announces them to the swarm.
# The **MetaGateway** app must list this feeder's URL
# (`http://metafeederindexer-feeder:8080`) in its feeders config so it
# discovers + queries it (MetaGateway, MetaCore and this feeder share `pcs`).
#
# Everything is scoped under the `metafeederindexer-*` prefix + the
# per-stack `metafeederindexer` network + /DATA/AppData/metafeederindexer/
# data root, so it installs alongside the other Meta* apps with zero collisions.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # metafeederindexer-feeder — the feeder (meta-feeder-indexer) running the
  # Prowlarr/Torznab source. The gateway reaches it directly on `pcs` for
  # discovery/query/compute; the human configures it through the AppShield gate
  # below.
  # ---------------------------------------------------------------------------
  metafeederindexer-feeder:
    image: ghcr.io/worph/meta-feeder-indexer:1.0.9
    container_name: metafeederindexer-feeder
    # Hard RAM cap, swap disabled (memswap_limit == mem_limit) → OOM
    # instead of swap. Mirrors the dev sub-stack limits.
    mem_limit: 512m
    memswap_limit: 512m
    hostname: metafeederindexer-feeder
    restart: unless-stopped
    user: "0:0"
    expose:
      - 8080
    environment:
      # INFRA-ONLY env (the "config: no env if in webui" rule). Operator config —
      # Prowlarr indexers + API key, TMDB token / language, meta-core URL — is
      # read from the persisted config.json (this feeder's config page behind the
      # AppShield gate); env is only a deprecated first-boot seed. These env vars
      # are wiring only: the enrichment sidecars, the enrich callback, the peer id
      # and Prowlarr paging. meta-core defaults to the pcs
      # `http://metacore-app:9000`; Prowlarr is reached as `prowlarr:9696`.
      RUST_LOG: "info,meta_feeder=info,meta_feeder::store=debug"
      # The peer id stamped into provenance.gateway_peer on every record this
      # feeder self-publishes. It names the GATEWAY this feeder serves — not the
      # feeder itself — so records are attributed to the gateway that fronts them
      # (analytics group by it). Without it, it falls back to HOSTNAME.
      META_GATEWAY_PEER_ID: "metagateway"
      FILENAME_PARSER_URL: "http://metafeederindexer-filename-parser:8080"
      TMDB_PLUGIN_URL: "http://metafeederindexer-tmdb:8080"
      META_FEEDER_CALLBACK_URL: "http://metafeederindexer-feeder:8080/enrich/callback"
      # LOAD-BEARING at meta-feeder-indexer:1.0.9 — NOT a restatement of the
      # default: that build defaults the page size to 100. 20 is the pacing
      # choice (results stream 20-at-a-time). META_GATEWAY_PROWLARR_MAX_DEPTH
      # was dropped — its 500 did match the default.
      META_GATEWAY_PROWLARR_PAGE_SIZE: "20"
      TZ: "$TZ"
    volumes:
      # Persist feeder config (config.json saved via the config UI) + redb cache.
      # Transient librqbit downloads go to the container's /tmp (off backup).
      - /DATA/AppData/metafeederindexer/state:/data/meta-feeder:rw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      # service_started (not _healthy): the plugin images ship no healthcheck.
      metafeederindexer-filename-parser:
        condition: service_started
      metafeederindexer-tmdb:
        condition: service_started
    networks:
      - metafeederindexer
      - pcs

  # ---------------------------------------------------------------------------
  # Bundled enrichment plugins (self-contained). filename-parser per file; tmdb
  # once per torrent — tmdb writes posters/backdrops to the gateway core's WebDAV.
  # No healthcheck: these plugin images don't ship one (curl absent).
  # ---------------------------------------------------------------------------
  metafeederindexer-filename-parser:
    image: ghcr.io/worph/metamesh-plugin-filename-parser:1.0.1
    container_name: metafeederindexer-filename-parser
    # Hard RAM cap, swap disabled (memswap_limit == mem_limit) → OOM
    # instead of swap. Mirrors the dev sub-stack limits.
    mem_limit: 256m
    memswap_limit: 256m
    hostname: metafeederindexer-filename-parser
    restart: unless-stopped
    expose:
      - 8080
    environment:
      EMIT_TITLE_TAGS: "true"
    networks:
      - metafeederindexer

  metafeederindexer-tmdb:
    image: ghcr.io/worph/metamesh-plugin-tmdb:1.0.0
    container_name: metafeederindexer-tmdb
    # Hard RAM cap, swap disabled (memswap_limit == mem_limit) → OOM
    # instead of swap. Mirrors the dev sub-stack limits.
    mem_limit: 384m
    memswap_limit: 384m
    hostname: metafeederindexer-tmdb
    restart: unless-stopped
    expose:
      - 8080
    environment:
      # Posters land in the gateway core (over pcs) so the ingester seeds them.
      # LOAD-BEARING at metamesh-plugin-tmdb:1.0.0 — do NOT remove.
      # Newer source derives WebDAV from the metaCoreUrl passed on each /process
      # (GET /urls -> webdavUrlInternal), which is why the dev compose omits it. The
      # PUBLISHED image predates that: without this var it logs "WebDAV client
      # unavailable" and silently writes no posters/backdrops, so every record then
      # fails meta-watch's poster gate. Drop only after re-tagging the plugin.
      WEBDAV_URL: "http://metacore-app:9000/webdav"
    volumes:
      - /DATA/AppData/metafeederindexer/tmdb-cache:/cache
    networks:
      - metafeederindexer
      - pcs

  # ---------------------------------------------------------------------------
  # AppShield gate — the feeder's config UI (set the Prowlarr key, TMDB token)
  # behind Yundera OIDC SSO. container_name == subdomain prefix. The gateway
  # still reaches the feeder directly on `pcs` (this gate is for the human only);
  # index → /config.
  # ---------------------------------------------------------------------------
  metafeederindexer:
    image: ghcr.io/yundera/appshield:2.0.6
    container_name: metafeederindexer
    hostname: metafeederindexer
    restart: unless-stopped
    user: "0:0"
    expose:
      - 80
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      CREDENTIAL_VALIDATE_URL: "http://casaos-oidc-bridge:8090/validate"
      BACKEND_HOST: "metafeederindexer-feeder"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
    labels:
      caddy_0: metafeederindexer-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: metafeederindexer-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: metafeederindexer-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - metafeederindexer-feeder
    networks:
      - metafeederindexer
      - pcs

networks:
  metafeederindexer:
    name: metafeederindexer
  pcs:
    name: pcs
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Worph Team
  category: Media
  developer: Aptero Team
  main: metafeederindexer
  webui_port: 80
  index: /config

  description:
    en_us: |
      **A standalone torrent + usenet feeder for the MetaMesh network.**

      MetaFeeder - Indexer bridges your **Prowlarr** indexers
      (Torznab/Newznab — torrent *and* usenet) into MetaMesh, so releases surface
      in **MetaWatch**. It's the torrent/usenet source tier, split out of
      MetaGateway so you can run only the feeders you want.

      **Self-contained:** ships its own filename-parser + TMDB enrichment, so each
      release gets a clean title, poster and plot.

      **Source:**
      - **Prowlarr** — Torznab/Newznab indexers, torrent or usenet (reached as
        `prowlarr` on the shared network).

      **Want decentralized discovery too?** Install **MetaFeeder · Tribler** — the
      Tribler source now lives in its own app.

      **Also requires:** **MetaGateway** — its meta-core stores the resolved
      records and announces them to the swarm. The gateway must list this feeder
      in its config.

    fr_fr: |
      **Un feeder torrent + usenet autonome pour le réseau MetaMesh.**

      MetaFeeder - Indexer connecte vos indexeurs **Prowlarr**
      (Torznab/Newznab — torrent *et* usenet) à MetaMesh pour qu'ils apparaissent
      dans **MetaWatch**. C'est la couche de sources torrent/usenet, détachée de
      MetaGateway pour n'exécuter que les feeders souhaités.

      **Autonome :** embarque ses propres plugins filename-parser + TMDB.

      **Source :** l'app **Prowlarr** (indexeurs Torznab/Newznab, torrent ou
      usenet, atteinte comme `prowlarr`).

      **Envie de découverte décentralisée ?** Installez **MetaFeeder · Tribler** —
      la source Tribler est désormais une app dédiée.

      **Nécessite aussi :** l'app **MetaGateway** (son meta-core stocke et annonce
      les enregistrements).

  tagline:
    en_us: Standalone Prowlarr/Torznab (torrent + usenet) feeder for MetaMesh
    fr_fr: Feeder Prowlarr/Torznab (torrent + usenet) autonome pour MetaMesh

  title:
    en_us: MetaFeeder - Indexer

  icon: https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/MetaFeederIndexer/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/MetaFeederIndexer/thumbnail.png

  store_app_id: metafeederindexer
  is_uncontrolled: false

  tips:
    before_install:
      en_us: |
        **Install order:** install **MetaGateway** first, plus the **Prowlarr**
        store app (Torznab/Newznab).

        **After installing this app:**
        1. In **Prowlarr**: complete its first-run wizard, add one or more
           indexers (torrent or usenet), then copy the **API Key**
           (Settings → General).
        2. Open this app's config UI (the dashboard link). Paste the Prowlarr key
           into the indexer's API-key field; optionally set a TMDB v4 token for
           posters. Save — the feeder reloads automatically.
        3. In **MetaGateway**, make sure this feeder is listed in its feeders
           config (`http://metafeederindexer-feeder:8080`) so it gets
           discovered.

        **Authentication:** the config UI is protected by Yundera's Authelia (OIDC).

  pre-install-cmd: |
    mkdir -p /DATA/AppData/metafeederindexer/state
    mkdir -p /DATA/AppData/metafeederindexer/tmdb-cache
