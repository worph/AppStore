name: suwayomi

# =============================================================================
# Suwayomi (Tachidesk) — the manga SOURCE AGGREGATOR, with FlareSolverr.
#
# Standalone on purpose: it is a perfectly good self-hosted manga reader on its
# own, AND it is the chapter tier **MetaFeeder · Suwayomi** reads. Install this
# first, then that app — the feeder ships preconfigured for `suwayomi:4567`
# over the shared `pcs` network, so the pair needs no wiring.
#
# The MetaMesh apps moved to their own store: add
# https://github.com/Worph/MetaAppStore/archive/refs/heads/main.zip as a source
# to install MetaFeeder · Suwayomi and MetaRead.
#
# ── ⚠ Why AUTH_MODE is `none` + an AppShield gate ────────────────────────────
# Suwayomi's own `simple_login` does NOT gate `/api/graphql` (200 unauth) but
# DOES gate the `/api/v1/…` REST routes (401). Those REST routes are exactly
# where an undownloaded chapter's per-page locators point, and meta-share
# redeems them on the READER's peer with no credentials — so `simple_login`
# yields a library that lists every chapter and cannot open one. Measured, not
# assumed (tachidesk v2.3.2243).
#
# So auth is moved OUT of Suwayomi and onto the Yundera perimeter: the server
# itself is unauthenticated on the internal network, and the only route into it
# from outside is the `suwayomi-gate` AppShield sidecar, which is OIDC SSO —
# strictly stronger than the shared admin password it replaces.
#
# ⚠ Corollary: do NOT publish `suwayomi:4567` through Caddy directly, and do not
# re-enable AUTH_MODE while MetaFeeder · Suwayomi is installed.
#
# ── FlareSolverr ─────────────────────────────────────────────────────────────
# Several sources (Mangakakalot among them) sit behind a Cloudflare interstitial
# and fail every search with "Cloudflare bypass currently disabled" unless a
# solver is wired in. The sidecar answers that challenge (~11 s the first time,
# then cached for the session TTL). It is on a PRIVATE network — it is a
# headless browser and has no business being reachable from `pcs`.
# =============================================================================

services:
  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:v2.3.2243
    user: $PUID:$PGID
    container_name: suwayomi
    hostname: suwayomi
    restart: unless-stopped
    expose:
      - 4567
    networks:
      - pcs
      - suwayomi-internal
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BIND_IP: 0.0.0.0
      BIND_PORT: 4567
      # See the header. `none` is load-bearing for MetaFeeder · Suwayomi.
      AUTH_MODE: none
      DOWNLOAD_AS_CBZ: true
      AUTO_DOWNLOAD_CHAPTERS: false
      WEB_UI_CHANNEL: bundled
      WEB_UI_UPDATE_INTERVAL: 0.0
      EXTENSION_REPOS: >-
        ["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]
      FLARESOLVERR_ENABLED: true
      FLARESOLVERR_URL: http://suwayomi-flaresolverr:8191
    volumes:
      - ${DATA_ROOT:-/DATA}/Media/Mangas/:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/data/:/home/suwayomi/.local/share/Tachidesk
    depends_on:
      - flaresolverr
    # ⚠ No healthcheck: the image is a bare JRE runtime with neither `wget` nor
    # `curl`, so every HTTP-shaped probe fails regardless of server state.
    cpu_shares: 50
    mem_limit: 2g
    memswap_limit: 2g

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: suwayomi-flaresolverr
    hostname: suwayomi-flaresolverr
    user: 0:0
    restart: unless-stopped
    expose:
      - 8191
    networks:
      - suwayomi-internal
    environment:
      TZ: $TZ
      LOG_LEVEL: info
    cpu_shares: 20
    mem_limit: 512m
    memswap_limit: 512m

  # ---------------------------------------------------------------------------
  # AppShield gate — the ONLY public route to Suwayomi's UI, behind Yundera OIDC
  # SSO. container_name == subdomain prefix.
  # ---------------------------------------------------------------------------
  suwayomi-gate:
    image: ghcr.io/yundera/appshield:2.0.9
    container_name: suwayomi-gate
    hostname: suwayomi-gate
    user: "0:0"
    restart: unless-stopped
    expose:
      - 80
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "suwayomi"
      BACKEND_PORT: "4567"
      LISTEN_PORT: "80"
    labels:
      caddy_0: suwayomi-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: suwayomi-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: suwayomi-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - suwayomi
    networks:
      - suwayomi-internal
      - pcs
    cpu_shares: 20

networks:
  suwayomi-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  # The gate, not the server: `suwayomi` is unauthenticated and must never be
  # the published surface. See the AUTH_MODE note in the header.
  main: suwayomi-gate
  index: /
  webui_port: 80
  hostname: suwayomi-${APP_DOMAIN}
  scheme: https
  port_map: "443"
  store_app_id: suwayomi
  architectures:
    - amd64
    - arm64
  author: Yundera Team
  category: Media
  developer: Suwayomi Project
  icon: https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/Suwayomi/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/Suwayomi/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/Suwayomi/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/Suwayomi/screenshot-3.png
  thumbnail: https://cdn.jsdelivr.net/gh/Worph/AppStore@main/Apps/Suwayomi/screenshot-1.png
  title:
    en_us: Suwayomi
  tagline:
    en_us: Personal manga library with 1200+ sources
    fr_fr: Bibliothèque manga personnelle avec plus de 1200 sources
    es_es: Biblioteca personal de manga con más de 1200 fuentes
    zh_cn: 拥有1200+源的个人漫画图书馆
    ko_kr: 1200개 이상의 소스를 가진 개인 만화 라이브러리
  description:
    en_us: |
      Suwayomi lets you read thousands of manga from around the world, all in one place. Instead of visiting dozens of different websites, everything is organized in one app that tracks your reading progress automatically.

      **Key features:**
      • Browse 1200+ manga sources worldwide
      • Automatic reading progress tracking
      • Download chapters for offline reading
      • FlareSolverr built-in for protected sources
      • Compatible with Tachiyomi/Mihon extensions

      **Perfect for:** Manga readers who want a self-hosted library that keeps track of multiple series across different sources.
    fr_fr: |
      Suwayomi vous permet de lire des milliers de mangas du monde entier, tout en un seul endroit. Au lieu de visiter des dizaines de sites différents, tout est organisé dans une application qui suit automatiquement votre progression.

      **Fonctionnalités clés :**
      • Parcourez plus de 1200 sources de manga
      • Suivi automatique de la progression de lecture
      • Téléchargez des chapitres pour lire hors ligne
      • FlareSolverr intégré pour les sources protégées
      • Compatible avec les extensions Tachiyomi/Mihon
    es_es: |
      Suwayomi te permite leer miles de mangas de todo el mundo, todo en un solo lugar. En lugar de visitar docenas de sitios web diferentes, todo está organizado en una app que rastrea tu progreso de lectura automáticamente.

      **Características clave:**
      • Navega por más de 1200 fuentes de manga
      • Seguimiento automático del progreso de lectura
      • Descarga capítulos para leer sin conexión
      • FlareSolverr integrado para fuentes protegidas
      • Compatible con extensiones Tachiyomi/Mihon
    zh_cn: |
      Suwayomi让您在一个地方阅读来自世界各地的数千部漫画。不再需要访问数十个不同的网站，所有内容都在一个自动跟踪阅读进度的应用中整理。

      **主要功能：**
      • 浏览全球1200+漫画源
      • 自动跟踪阅读进度
      • 下载章节离线阅读
      • 内置FlareSolverr应对受保护源
      • 兼容Tachiyomi/Mihon扩展
    ko_kr: |
      스와요미는 전 세계 수천 개의 만화를 한 곳에서 읽을 수 있게 해줍니다. 수십 개의 다른 웹사이트를 방문하는 대신, 모든 것이 자동으로 읽기 진행 상황을 추적하는 하나의 앱에서 정리됩니다.

      **주요 기능:**
      • 전 세계 1200개 이상의 만화 소스 탐색
      • 자동 읽기 진행 상황 추적
      • 오프라인 읽기를 위한 챕터 다운로드
      • 보호된 소스를 위한 FlareSolverr 내장
      • Tachiyomi/Mihon 확장 호환
  tips:
    before_install:
      en_us: |
        **Getting Started**

        Sign in with your Yundera account — the app is behind the same SSO as
        every other app on this server, so there is no separate password.

        **How to use:**
        1. Open the app and sign in
        2. Under *Extensions*, install the sources you want — none are installed
           by default, and Cloudflare-protected ones work thanks to the bundled
           FlareSolverr
        3. Click "Browse" to search those sources
        4. Start reading — your progress saves automatically

        **Pairing with MetaMesh:** install **MetaFeeder · Suwayomi** and the sources
        you enable here become readable in **MetaRead**. That app ships pointed
        at `suwayomi:4567`, so there is nothing to configure. Both live in the
        separate **MetaAppStore** source.

        **Tip:** Download chapters on WiFi, then read offline during commutes!
      fr_fr: |
        **Pour commencer**

        Connectez-vous avec votre compte Yundera — l'app est derrière le même SSO
        que les autres, il n'y a donc pas de mot de passe séparé.

        **Comment utiliser :**
        1. Ouvrez l'app et connectez-vous
        2. Cliquez sur "Parcourir" pour trouver des sources
        3. Recherchez vos mangas favoris
        4. Commencez à lire — votre progression se sauvegarde automatiquement
      es_es: |
        **Para empezar**

        Inicia sesión con tu cuenta de Yundera — la app está detrás del mismo SSO
        que las demás, así que no hay una contraseña aparte.

        **Cómo usar:**
        1. Abre la app e inicia sesión
        2. Haz clic en "Explorar" para encontrar fuentes
        3. Busca tus mangas favoritos
        4. Comienza a leer — tu progreso se guarda automáticamente
      zh_cn: |
        **开始使用**

        使用您的 Yundera 账户登录 — 本应用与服务器上其他应用共用同一套 SSO，
        因此没有单独的密码。

        **使用方法：**
        1. 打开应用并登录
        2. 点击"浏览"查找漫画源
        3. 搜索您喜爱的漫画
        4. 开始阅读 — 进度自动保存
      ko_kr: |
        **시작하기**

        Yundera 계정으로 로그인하세요 — 이 앱은 서버의 다른 앱과 동일한 SSO 뒤에
        있으므로 별도의 비밀번호가 없습니다.

        **사용 방법:**
        1. 앱을 열고 로그인
        2. "찾아보기"를 클릭하여 소스 찾기
        3. 좋아하는 만화 검색
        4. 읽기 시작 — 진행 상황이 자동 저장됩니다

x-compose-app:
  schema_version: 2
  # Created and chowned by Maison before any image is pulled and before the
  # containers start — compose would otherwise create a missing bind source as a
  # root-owned dir, which the $PUID:$PGID server then cannot write.
  folders:
    - path: /DATA/AppData/$AppID/data
      user: $PUID
      group: $PGID
    - path: /DATA/Media/Mangas
      user: $PUID
      group: $PGID
  # Same string as the caddy_0 label, so the tile link and the route agree.
  webui-host: suwayomi-${domain}
  webui-path: "/"
